<!DOCTYPE html>
<html lang="zh">
<head>
    <title>Hitomi Viewer</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/viewerjs/1.11.6/viewer.min.css">
    <link rel="stylesheet" href="/src/viewer.css?v=shared-viewer-1">
</head>
<body class="hitomi-viewer standalone-viewer">

    <div class="viewport">
        <div id="loadingState" role="status">
            <div class="spinner"></div>
            <div id="loadingText">正在获取 Hitomi 内容...</div>
            <button id="retryPage" type="button" hidden>重试本页</button>
        </div>
        <img id="displayedImage" alt="Document Page">
    </div>

    <div class="toolbar">
        <div>
            <button id="btnPrev" type="button" disabled>Prev</button>
        </div>
        <div class="group-center">
            <span class="page-info">
                <span id="current" style="color: var(--accent-color); font-size: 1.1em;">-</span>
                / <span id="total">-</span>
            </span>
            <div style="font-size: 10px; color: #666; margin-top: 2px;">
                <label for="stepInput">Step:</label> <input type="number" id="stepInput" min="1" value="1" aria-label="翻页步长">
            </div>
        </div>
        <div class="cache-status" aria-label="图片缓存">
            <div class="cache-status-line">
                <span id="cacheSummary">已缓存 0 / — 页</span>
                <span id="cacheActivity">等待文档…</span>
                <button id="retryCache" type="button" hidden>重试失败页</button>
            </div>
            <progress id="cacheProgress" value="0" max="1" aria-label="漫画缓存进度"></progress>
        </div>
        <div>
            <button id="btnNext" type="button" disabled>Next</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/viewerjs/1.11.6/viewer.min.js"></script>
    <script>var gg = {};</script>
    <script src="https://ltn.gold-usergeneratedcontent.net/gg.js"></script>
    <script type="module">
        import { startViewer } from "/src/viewer.js?v=shared-viewer-1";
        import { loadHitomiDocument } from "/src/hitomi-viewer.js?v=shared-viewer-1";
        startViewer({
            loadDocument: loadHitomiDocument,
            loadingMessage: "正在获取 Hitomi 内容…",
        });
    </script>
</body>
</html>
